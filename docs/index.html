<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google ADK Workshop</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/dark.css">
  <style>
    :root {
      --theme-color: #4285f4;
      --sidebar-width: 280px;
    }

    /* ── Base ── */
    body {
      background: #13151f !important;
    }

    /* ── Sidebar ── */
    .sidebar {
      background: #0f1117 !important;
      border-right: 1px solid #1e2130 !important;
    }
    .sidebar .sidebar-nav ul li a {
      color: #9aa0b4 !important;
      font-size: 0.88rem;
      padding: 4px 0;
      transition: color 0.15s;
    }
    .sidebar .sidebar-nav ul li a:hover,
    .sidebar .sidebar-nav ul li a.active {
      color: #4285f4 !important;
    }
    .sidebar .sidebar-nav ul li strong {
      color: #5f6b8a;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: block;
      margin: 1.2em 0 0.3em;
    }
    .app-name-link {
      font-weight: 700 !important;
      font-size: 1.05rem !important;
      color: #e2e8f0 !important;
      letter-spacing: -0.01em;
    }
    .sidebar-toggle {
      background: #0f1117 !important;
    }

    /* ── Main content area ── */
    .main, .content, section.main {
      background: #13151f !important;
    }
    .markdown-section {
      max-width: 820px;
      padding: 2.5rem 3rem !important;
      background: #13151f !important;
      color: #c9d1e0 !important;
    }

    /* headings */
    .markdown-section h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #e2e8f0;
      border-bottom: 2px solid #1e2130;
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .markdown-section h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #c9d1e0;
      margin-top: 2.5rem;
      border-left: 3px solid #4285f4;
      padding-left: 0.75rem;
    }
    .markdown-section h3 {
      font-size: 1rem;
      font-weight: 600;
      color: #a8b3c8;
    }

    /* links */
    .markdown-section a {
      color: #5a9cf5 !important;
    }
    .markdown-section a:hover {
      color: #7ab3ff !important;
    }

    /* code blocks */
    .markdown-section pre {
      background: #0a0c14 !important;
      border: 1px solid #1e2130;
      border-radius: 8px;
      position: relative;
    }
    .markdown-section pre > code {
      background: transparent !important;
      font-size: 0.82rem !important;
      line-height: 1.6 !important;
    }
    .markdown-section code:not([class]) {
      background: #1a1d2e !important;
      color: #a5f3a5;
      border-radius: 4px;
      padding: 0.15em 0.45em;
      font-size: 0.85em;
    }

    /* blockquotes / tips */
    .markdown-section blockquote {
      background: #131929 !important;
      border-left: 4px solid #4285f4;
      border-radius: 0 6px 6px 0;
      padding: 0.8rem 1.2rem;
      margin: 1.2rem 0;
      color: #8fa3c8;
    }
    .markdown-section blockquote p {
      margin: 0;
      color: #8fa3c8;
    }

    /* tables */
    .markdown-section table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 6px;
      overflow: hidden;
    }
    .markdown-section thead tr {
      background: #1a1d2e !important;
    }
    .markdown-section thead th {
      color: #9aa8c4 !important;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.6rem 1rem;
      border: none !important;
      background: #1a1d2e !important;
    }
    .markdown-section tbody tr {
      background: #13151f !important;
      border-bottom: 1px solid #1e2130 !important;
    }
    .markdown-section tbody tr:hover {
      background: #1a1d2e !important;
    }
    .markdown-section td {
      padding: 0.55rem 1rem;
      border: none !important;
      color: #b8c4d8;
      font-size: 0.88rem;
    }

    /* horizontal rules */
    .markdown-section hr {
      border: none;
      border-top: 1px solid #1e2130;
      margin: 2rem 0;
    }

    /* copy-code button (docsify-copy-code) */
    .docsify-copy-code-button {
      background: #1e2130 !important;
      color: #6b7a99 !important;
      border-radius: 4px !important;
      font-size: 0.7rem !important;
    }
    .docsify-copy-code-button:hover {
      color: #4285f4 !important;
    }

    /* cover page */
    section.cover {
      background: linear-gradient(135deg, #0a0c14 0%, #0f1829 100%) !important;
    }
    .cover-main h1 {
      font-size: 3rem;
      font-weight: 800;
      color: #e2e8f0;
    }
    .cover-main blockquote {
      background: none !important;
      border: none !important;
    }
    .cover-main blockquote p {
      font-size: 1.1rem;
      color: #8fa3c8;
      background: none !important;
    }
    .cover-main a.button {
      background: #4285f4 !important;
      border-color: #4285f4 !important;
      border-radius: 6px !important;
      font-weight: 600 !important;
      color: #fff !important;
    }
    .cover-main a.button:last-child {
      background: transparent !important;
      border-color: #2a3a5e !important;
      color: #8fa3c8 !important;
    }

    /* pagination */
    .pagination-nav a {
      color: #4285f4 !important;
      border-color: #1e2130 !important;
      background: #0f1117 !important;
    }
    .pagination-nav a:hover {
      background: #1a1d2e !important;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: 'ADK Workshop',
      repo: '',
      coverpage: true,
      onlyCover: false,
      homepage: 'pages/00-welcome.md',
      loadSidebar: true,
      subMaxLevel: 2,
      executeScript: true,
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!',
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true,
      },
    };
  </script>

  <!-- Core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>

  <!-- Syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>

  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
</body>
</html>
